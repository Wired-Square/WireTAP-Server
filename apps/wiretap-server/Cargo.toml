# The capture daemon's web UI: a workspace of its own, so the root workspace
# and its release build without the chassis.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Alex Ferrara <alex@wiredsquare.com>"]
repository = "https://github.com/Wired-Square/WireTAP-Server"

[workspace.dependencies]
wslib-appliance-config = { version = "0.1.1", registry = "wired-square" }
wslib-appliance-https = { version = "0.1.1", registry = "wired-square" }
wslib-appliance-server = { version = "0.1.1", registry = "wired-square" }
wslib-appliance-store = { version = "0.1.1", registry = "wired-square" }
wslib-appliance-types = { version = "0.1.1", registry = "wired-square" }

axum = { version = "0.8.7", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1.8.0", default-features = false }
hyper-util = { version = "0.1.18", default-features = false, features = ["tokio"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
serde_json = "1.0.85"
tempfile = "3.10.1"
tokio = { version = "1.47.0", default-features = false }
tracing = "0.1.41"
wslib-auth-totp = { version = "0.1.1", registry = "wired-square" }
wslib-build-id = { version = "0.1", registry = "wired-square" }
wslib-telemetry = { version = "0.1.9", registry = "wired-square", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
