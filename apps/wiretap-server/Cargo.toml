# The capture daemon's web UI: a workspace of its own, so the root workspace,
# its release and any fork build without the private chassis.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Alex Ferrara <alex@wiredsquare.com>"]
repository = "https://github.com/Wired-Square/WireTAP-Server"

[workspace.dependencies]
# One tag on every line: two would be two checkouts and two `Store` types.
appliance-build-id = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.11.1" }
appliance-config = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.11.1" }
appliance-https = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.11.1" }
appliance-server = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.11.1" }
appliance-store = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.11.1" }
appliance-types = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.11.1" }

axum = { version = "0.8", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
