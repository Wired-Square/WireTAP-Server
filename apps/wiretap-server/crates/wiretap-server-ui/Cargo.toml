[package]
name = "wiretap-server-ui"
description = "The capture daemon's web UI, on its control socket: standalone over HTTPS, or behind an ApplianceOS console."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
appliance-config = { workspace = true }
appliance-https = { workspace = true }
appliance-server = { workspace = true }
appliance-store = { workspace = true }
appliance-types = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "macros", "tokio"] }
clap = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "time"] }
tracing = { workspace = true }
wslib-build-id = { workspace = true }
wslib-telemetry = { workspace = true, features = ["journald"] }

[build-dependencies]
wslib-build-id = { workspace = true }

[dev-dependencies]
appliance-https = { workspace = true, features = ["test-support"] }
appliance-server = { workspace = true, features = ["test-support"] }
wslib-auth-totp = { workspace = true }
