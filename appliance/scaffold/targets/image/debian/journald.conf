# Shipped by wiretap-appliance as /usr/lib/systemd/journald.conf.d/95-wiretap-appliance-persistent.conf.
#
# What a journal in RAM loses at a reboot is wiretap-appliance's own log: every refusal,
# which reaches only the journal, every error, and the start-up lines somebody
# reads after the reboot they are trying to explain. journald's own default,
# Storage=auto, is persistent wherever /var/log/journal exists; Raspberry Pi OS
# ships 40-rpi-volatile-storage.conf with Storage=volatile, which is what this
# file sits above.
#
# Drop-ins are last-value-wins and merge across /usr/lib, /run and /etc sorted
# by file name alone, so the number is the whole of the precedence: 95- sits
# above every distribution file. To override this, add a 99-local.conf under
# /etc/systemd/journald.conf.d/, or a file of this same name there, which masks
# this one; a package's file under /usr/lib is never edited in place.
#
# SystemMaxUse bounds the space and not the writes; what costs writes is
# Storage=persistent itself, and journald syncs on an interval rather than per
# line, so a quiet daemon costs a card little.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=1month
