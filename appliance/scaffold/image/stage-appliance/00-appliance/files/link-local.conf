# Chassis-owned. A 169.254 address on every interface beside whatever DHCP
# gives it, so a box on a bare cable with no lease still answers on
# `<name>.local` — which is how a laptop reaches one with nothing else on the
# wire. `3` is NetworkManager's "enabled": in addition to the method, never
# instead of it.
[connection]
ipv4.link-local=3
