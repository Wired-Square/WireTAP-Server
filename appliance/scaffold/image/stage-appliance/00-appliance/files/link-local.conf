# Chassis-owned. A 169.254 address on every interface, so a box on a bare
# cable with no lease still answers on `wiretap-<serial>.local` —
# which is how a laptop reaches one with nothing else on the wire. `4`,
# NetworkManager's `fallback` (1.52+), takes it while no other IPv4 address is
# set, including while DHCP is pending, and drops it when a lease arrives; `3`,
# `enabled`, keeps it beside the lease. Numeric, as conf.d defaults are read.
[connection]
ipv4.link-local=4
