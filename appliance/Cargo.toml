# The Raspberry Pi appliance: a workspace of its own, so the root workspace,
# its release and any fork build without the private chassis.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Alex Ferrara <alex@wiredsquare.com>"]
repository = "https://github.com/Wired-Square/WireTAP-Server"

[workspace.dependencies]
# One tag on every line: two would be two checkouts and two `Store` types.
appliance-backup = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }
appliance-backup-host = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }
appliance-build-id = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }
appliance-config = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }
appliance-host = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }
appliance-server = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }
appliance-store = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }
appliance-types = { git = "https://github.com/Wired-Square/wslib-appliance-rs.git", tag = "v0.1.0" }

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tracing = "0.1"
axum = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
