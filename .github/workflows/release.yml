# Everything a tag publishes: the capture server's .deb files, and the
# gateway's multi-architecture image.
#
# Draft first, as the desktop repo does it: every job uploads into a draft
# release and a person publishes it.
#
# The gates are deliberately not re-run here — `ci.yml` proves the tree, and
# proving it twice for the same commit buys nothing. What that argument does
# NOT cover is a tag placed on a commit CI never ran on, because the draft it
# produces looks exactly like a good one; so the draft job asks the API whether
# CI actually passed for this SHA. A person publishing a draft is a review of
# the *release*, not a substitute for the gates.
#
# The .deb files are cross-compiled in ONE job. Both are static musl builds
# produced by cargo-zigbuild, so an arm64 runner buys nothing here. The image
# is the opposite case and gets one native runner per architecture: an emulated
# arm64 Rust compile is twenty to forty minutes.

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  # Not cancel-in-progress: half-uploaded release assets are worse than a
  # duplicate run.
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Before anything is created. The tag is the only part of a release that
      # cannot be corrected in place, and three files have to agree about what
      # version this is: the tag, Cargo.toml, and debian/changelog.
      # make-deb.sh already refuses to build when the last two disagree, so
      # this only has to bring the tag into that set.
      - name: The tag names the version being built
        run: |
          version="$(awk '/^\[workspace\.package\]/{f=1} f && /^version[[:space:]]*=/{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml says ${version}, the tag says ${tag}"
          test "${version}" = "${tag}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml" >&2
            exit 1
          }

      # A tag can be put on any commit, including one CI never ran on — and a
      # draft built from such a commit looks exactly like a good one: two .deb
      # files, a SHA256SUMS, a two-architecture manifest. There is nothing for
      # the person publishing it to notice, so the check has to be here.
      #
      # By head_sha rather than `workflow_run`: ci.yml triggers on main and on
      # pull requests, so it never runs on a tag ref at all. This finds the run
      # for the same commit, which also proves the commit reached main or a PR.
      # Tag after CI is green; tagging alongside the push races it.
      - name: CI passed for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" \
            --jq '.workflow_runs | length')
          echo "successful CI runs for ${GITHUB_SHA}: ${runs}"
          test "${runs}" -gt 0 || {
            echo "::error::no successful CI run for ${GITHUB_SHA}; tag a commit CI has passed" >&2
            exit 1
          }

      # Idempotent, so a re-run after a transient failure does not abort on
      # "release already exists" and need the draft deleted by hand.
      - name: Create the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "WireTAP Server ${GITHUB_REF_NAME}" \
            --notes "See the [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."

  debs:
    name: Packages
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Both pinned, and both have to match what developers build with, since
      # that is the toolchain the cross-build is known to work under. Keep in
      # step with ci.yml.
      ZIG_VERSION: "0.16.0"
      CARGO_ZIGBUILD_VERSION: "0.23.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
          echo "RUSTC_VERSION=$(rustc -V | tr ' ' '-')" >> "$GITHUB_ENV"

      # No cache, deliberately. Actions caches are scoped by ref: a run on a tag
      # can read its own ref and the default branch, so a `release` key nothing
      # on main ever writes would miss every time and then save gigabytes into
      # a tag scope no later run can reach - evicting the caches that do hit.
      # A release happens rarely and a cold build is the honest thing for an
      # artefact somebody downloads.

      - name: Install zig and cargo-zigbuild
        run: |
          dir="zig-x86_64-linux-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${dir}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
          # Unpacks into a directory of its own name, not flat.
          czb="cargo-zigbuild-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CARGO_ZIGBUILD_VERSION}/${czb}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$czb" >> "$GITHUB_PATH"

      # Two files, not the six the plan first sketched: wiretap-web has no
      # crate yet and the gateway ships as an image, so this is one package.
      - name: Build the packages
        run: packaging/make-deb.sh --arch all

      # The checksums are what someone downloading over a link they were sent
      # can actually verify, so they are generated where the files were built
      # and never by hand.
      - name: Checksums
        working-directory: target/deb
        run: |
          sha256sum wiretap-server_*.deb | tee SHA256SUMS

      - name: Upload to the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: target/deb
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            wiretap-server_*.deb SHA256SUMS --clobber

  image:
    name: Gateway image (${{ matrix.arch }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    permissions:
      # A job-level block sets every scope it does not name to `none`, so the
      # checkout below needs `contents` stated even though nothing is written
      # with it.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects an upper-case path, and the owner here is `Wired-Square`.
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/wiretap-backend" \
            >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # push-by-digest needs the docker-container driver; the default `docker`
      # driver cannot do it.
      - name: A builder that can push by digest
        run: docker buildx create --use --driver docker-container

      # No tag on the push. Each architecture lands as a bare digest and the
      # manifest job below is what gives them a name, which is the only way to
      # get one image reference covering both without emulating either.
      #
      # The build context is the workspace root, which the Dockerfile's first
      # line explains: the crate is a workspace member and cargo needs the root
      # manifest and lockfile.
      - name: Build and push by digest
        run: |
          digest_dir="${RUNNER_TEMP}/digests"
          mkdir -p "$digest_dir"
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --file crates/wiretap-backend/Dockerfile \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            .
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")"
          echo "built ${{ matrix.arch }} as ${digest}"
          touch "${digest_dir}/${digest#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Gateway image (manifest)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/wiretap-backend" \
            >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v6
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # The one reference a deployment pulls. `latest` moves with it, because
      # crates/wiretap-backend/docker-compose.yml is what most people run and
      # it names no tag.
      - name: Combine the digests into one manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " $(ls digests))
          docker buildx imagetools inspect "${IMAGE}:${version}"
