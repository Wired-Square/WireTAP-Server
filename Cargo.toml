# Workspace root for WireTAP-Server.
#
# `version` is inherited by every member, so one `vX.Y.Z` tag covers the whole
# workspace and every .deb built from it.
#
# Dependency *versions* are declared here so two crates cannot disagree about a
# type that crosses between them. Feature sets are NOT: a member can only add to
# an inherited feature list, never subtract, so `features` in this table would
# become a floor for all five planned crates — including the static-musl
# appliance binaries, which want a much smaller tokio than the gateway does.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.13"
edition = "2021"
rust-version = "1.99"
license = "MIT"
authors = ["Alex Ferrara <alex@wiredsquare.com>"]
repository = "https://github.com/Wired-Square/WireTAP-Server"

[workspace.dependencies]
# --- the wslib-rs toolkit, from the private registry (.cargo/config.toml) ---
wslib-backoff = { version = "0.1.2", registry = "wired-square" }
wslib-build-id = { version = "0.1", registry = "wired-square" }
wslib-secret = { version = "0.1.1", registry = "wired-square" }
wslib-telemetry = { version = "0.1.5", registry = "wired-square", default-features = false }
wslib-service = { version = "0.1.1", registry = "wired-square" }
wslib-file-atomic = { version = "0.1.5", registry = "wired-square" }
# The WireTAP codecs and types, shared with the desktop. Two members on
# different versions of one would be two protocols on one link.
wslib-wiretap-protocol = { version = "0.2.1", registry = "wired-square" }
wslib-wiretap-catalogue = { version = "0.1", registry = "wired-square" }
wslib-wiretap-gateway = { version = "0.1", registry = "wired-square" }
wslib-can = { version = "0.1", registry = "wired-square" }
wslib-can-gvret = { version = "0.1", registry = "wired-square" }
wslib-can-socketcan = { version = "0.1", registry = "wired-square" }
wslib-checksum = { version = "0.1", registry = "wired-square" }
wslib-modbus = { version = "0.2.1", registry = "wired-square", default-features = false }
wslib-serial = { version = "0.1", registry = "wired-square" }

# --- CLI ---
clap = { version = "4", default-features = false }

# --- CAN capture (Linux only) ---
# Only the vcan drills' end of the bus: the server reads and writes through
# wslib-can-socketcan.
socketcan = { version = "3.6.1", default-features = false }

# --- async runtime and HTTP ---
axum = "0.8"
http-body-util = "0.1"
hyper = "1.1.0"
hyper-util = "0.1.3"
tokio = "1.53.3"
tower-http = "0.6"
futures-util = "0.3"

# --- PostgreSQL ---
# Only the gateway uses these. The capture server forwards to it over the binary
# ingest protocol rather than writing to PostgreSQL, which is what keeps its .deb
# a static musl binary with no TLS stack and no libpq.
deadpool-postgres = "0.14"
tokio-postgres = "0.7.9"
# The SCRAM verifier for a rotated password, computed client-side.
postgres-protocol = "0.6.6"

# --- local storage ---
# The capture server's disk cache, holding frames through a gateway outage. The
# `bundled` feature compiles SQLite itself, which is what keeps the .deb a
# static musl binary with no libsqlite3 to depend on.
rusqlite = "0.40"

# --- serialisation and encoding ---
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.85"
toml = "1"
chrono = "0.4.39"
base64 = "0.22"
bytes = "1.4.0"
hex = "0.4"
# A database archive's compression: gzip, which a browser can also read with
# its own DecompressionStream, and pure Rust behind the default backend.
flate2 = "1.0.2"

# --- hashing and secrets ---
# sha2 hashes API keys at rest.
sha2 = "0.10"
# A catalogue is named by its Git blob SHA-1, as `git hash-object` names it.
sha1 = "0.10"
rand = "0.8.5"

# --- logging ---
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false }

# One binary per package, shipped to appliances over the network: size and
# start-up cost more than build time does. codegen-units = 1 is worth its ~5s —
# without it the binary is 35% larger.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
