# Workspace root for WireTAP-Server.
#
# `version` is inherited by every member, so one `vX.Y.Z` tag covers the whole
# workspace and every .deb built from it.
#
# Dependency *versions* are declared here so two crates cannot disagree about a
# type that crosses between them. Feature sets are NOT: a member can only add to
# an inherited feature list, never subtract, so `features` in this table would
# become a floor for all five planned crates — including the static-musl
# appliance binaries, which want a much smaller tokio than the gateway does.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Alex Ferrara <alex@wiredsquare.com>"]
repository = "https://github.com/Wired-Square/WireTAP-Server"

[workspace.dependencies]
# --- extracted for the WireTAP desktop to share ---
# The GVRET codec, the CAN data length code table and the ingest id-flag
# layout: the wire formats with one end here and one end in a repo this one
# cannot see. The desktop has not adopted it yet — it still carries its own two
# GVRET codecs and its own copies of the DLC table — so today this buys one
# definition rather than one implementation, and the point of moving first is
# that adopting is then a deletion. Three members here take it, so the rule
# above earns its keep twice: a tag they disagreed about would be two protocols
# in one binary.
#
# `https`, not the `ssh` form wiretap-lib-rs's README shows: that repository is
# public and nothing here has a key. CI runs on a stock runner, the gateway
# image builds in a container, and the .deb is cross-compiled.
#
# The tag is the test gate too. wiretap-lib-rs cuts releases with
# `cargo release`, whose pre-release hook runs that repo's full fmt/clippy/test
# gate *before* the tag is created — so a tag cannot name a tree where the GVRET
# codec's golden-byte tests failed. Those tests do not run in this repo's CI,
# and that guarantee is why they do not need to. It holds only for tags cut
# that way; a hand-cut tag has no gate behind it.
wiretap-protocol = { git = "https://github.com/Wired-Square/wiretap-lib-rs.git", tag = "v0.15.1" }

# --- CLI ---
clap = { version = "4", default-features = false }

# --- CAN capture (Linux only) ---
# Replaces the Python's raw AF_CAN socket code and its pyroute2 dependency:
# the netlink module answers bitrate queries directly.
socketcan = { version = "3.6", default-features = false }

# --- async runtime and HTTP ---
axum = "0.8"
tokio = "1"
tower-http = "0.6"
futures-util = "0.3"

# --- PostgreSQL ---
# Only the gateway uses these. The capture server forwards to it over the binary
# ingest protocol rather than writing to PostgreSQL, which is what keeps its .deb
# a static musl binary with no TLS stack and no libpq.
deadpool-postgres = "0.14"
tokio-postgres = "0.7"

# --- local storage ---
# The capture server's disk cache, holding frames through a gateway outage. The
# `bundled` feature compiles SQLite itself, which is what keeps the .deb a
# static musl binary with no libsqlite3 to depend on.
rusqlite = "0.40"

# --- serialisation and encoding ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = "0.4"
base64 = "0.22"
bytes = "1"
hex = "0.4"

# --- hashing, checksums, secrets ---
# crc32fast is the ingest protocol's frame check; sha2 hashes API keys at rest;
# subtle compares an ingest token without leaking its length or contents to a
# timing attack, which is what the Python used `hmac.compare_digest` for.
crc32fast = "1"
sha2 = "0.10"
rand = "0.8"
subtle = "2"

# --- logging ---
tracing = "0.1"
tracing-subscriber = "0.3"

# One binary per package, shipped to appliances over the network: size and
# start-up cost more than build time does. codegen-units = 1 is worth its ~5s —
# without it the binary is 35% larger.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
