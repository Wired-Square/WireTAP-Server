# Workspace root for WireTAP-Server.
#
# `version` is inherited by every member, so one `vX.Y.Z` tag covers the whole
# workspace and every .deb built from it.
#
# Dependency *versions* are declared here so two crates cannot disagree about a
# type that crosses between them. Feature sets are NOT: a member can only add to
# an inherited feature list, never subtract, so `features` in this table would
# become a floor for all five planned crates — including the static-musl
# appliance binaries, which want a much smaller tokio than the gateway does.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Alex Ferrara <alex@wiredsquare.com>"]
repository = "https://github.com/Wired-Square/WireTAP-Server"

[workspace.dependencies]
# --- async runtime and HTTP ---
axum = "0.8"
tokio = "1"
tower-http = "0.6"
futures-util = "0.3"

# --- PostgreSQL ---
# Only the gateway uses these. The capture server forwards to it over the binary
# ingest protocol rather than writing to PostgreSQL, which is what keeps its .deb
# a static musl binary with no TLS stack and no libpq.
deadpool-postgres = "0.14"
tokio-postgres = "0.7"

# --- serialisation and encoding ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = "0.4"
base64 = "0.22"
bytes = "1"
hex = "0.4"

# --- hashing, checksums, secrets ---
# crc32fast is the ingest protocol's frame check; sha2 hashes API keys at rest.
crc32fast = "1"
sha2 = "0.10"
rand = "0.8"

# --- logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# One binary per package, shipped to appliances over the network: size and
# start-up cost more than build time does. codegen-units = 1 is worth its ~5s —
# without it the binary is 35% larger.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
