# The settings wiretap-can@can0.service brings can0 up with. Copy this to
# /etc/wiretap-server/can.d/can0.conf, named for the interface, and set the
# bitrate: the bus decides it, and a wrong one looks like a silent bus.
BITRATE=500000

# CAN FD: the data-phase bitrate. Setting it turns FD on; set [server] can_fd
# in wiretap-server.toml too.
#DBITRATE=2000000

# The transmit queue, in frames. The kernel's default of 10 overruns on a burst.
#TXQUEUELEN=65536

# Milliseconds before recovering from bus-off on its own. 0 leaves the
# interface down until it is brought up again, as does a device that cannot
# restart itself (gs_usb): can-up then goes on without it.
#RESTART_MS=100
