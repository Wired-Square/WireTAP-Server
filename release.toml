# cargo-release config — the one canonical release path. Every crate here
# inherits `[workspace.package] version`, so one command bumps all five and cuts
# one tag.
#
#   cargo install cargo-release              # once per machine
#   cargo release patch                      # dry-run preview (0.1.0 -> 0.1.1)
#   cargo release patch -x                   # --execute: bump, gate, commit, tag
#
# Distributed as a Debian package and a container image, never to crates.io.
#
# ## Releasing ends in one push
#
# `push = false` below. GitHub runs CI only on a release tag (scripts/ci-local.sh
# runs it locally before then), so `.github/workflows/release.yml` runs all of
# `ci.yml` on the tagged commit before it drafts or builds anything:
#
#   0. Ask whether to move the pinned TimescaleDB image (the backend's deploy
#      compose, its TrueNAS example, db/Dockerfile, CI's service in ci.yml).
#      That is a deployment: engine first, `ALTER EXTENSION timescaledb UPDATE`
#      per database, gateway restart.
#   1. Write the debian/changelog entry by hand, headed
#      `wiretap-server (<version>) UNRELEASED; urgency=medium`, and commit it.
#      It is prose about an upgrade path, and nothing can generate it. While
#      it says UNRELEASED, make-deb.sh and the contract check read the entry
#      below it, so this commit still builds a package.
#   2. `cargo release <level> -x` — bumps, stamps that entry with the version
#      and `bookworm`, runs the gates, commits, tags locally. Without an
#      UNRELEASED entry the pre-release hook refuses.
#   3. `git push origin main v<version>` — the tag runs CI, then drafts the
#      release, builds both .deb files and pushes the two-architecture gateway
#      image. It also leaves the ApplianceOS apps' unsigned source archive as
#      a workflow artefact, to sign by hand (apps/README.md § Signing a release).
#   4. Write the release notes over the draft's placeholder body, then publish
#      it by hand:
#
#        gh release edit v<version> --notes-file <filled-in copy>
#
#      `.github/release-notes-template.md` is the template and the house style,
#      which matches the WireTAP desktop's releases.
#
# If CI fails in the release run, nothing has been built or pushed to GHCR:
# delete the tag on both sides (`git push origin :refs/tags/v<version>`,
# `git tag -d v<version>`), fix through a PR, and start again at step 2.

publish = false
push = false
shared-version = true
allow-branch = ["main"]
tag-name = "v{{version}}"
pre-release-commit-message = "Release v{{version}}"
# Overrides cargo-release's `chore: Release {{crate_name}} version …` default,
# which is the wrong style for this repo and names one arbitrary crate — the tag
# covers all five. Matches the release title release.yml gives the draft.
tag-message = "WireTAP Server v{{version}}"

# Stamps the UNRELEASED debian/changelog entry. Every crate runs it, relative to
# its own directory, and each runs its replacements just before its own hook: so
# the first crate stamps the entry before any hook reads it, and `min = 0` lets
# the rest find it done. With no such entry, the hook's contract check refuses.
pre-release-replacements = [
    { file = "../../debian/changelog", search = '^wiretap-server \([^)]*\) UNRELEASED;', replace = "wiretap-server ({{version}}) bookworm;", min = 0 },
]

# Runs after the version is written into Cargo.toml and before anything is
# committed or tagged, so a tag is never cut from a red tree or from a tree whose
# three version files disagree. The musl clippy is not redundant with the first:
# the SocketCAN modules are `#[cfg(target_os = "linux")]`, so on a macOS host
# nothing else lints them at all — and this is usually released from a Mac.
pre-release-hook = [
    "bash",
    "-c",
    "\"$WORKSPACE_ROOT\"/scripts/check-release-contract.sh && cargo fmt --all -- --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo clippy -p wiretap-server --target aarch64-unknown-linux-musl --all-targets --locked -- -D warnings && cargo test --workspace --locked",
]
