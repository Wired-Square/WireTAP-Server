[package]
name = "wiretap-server"
description = "WireTAP capture server: SocketCAN to GVRET bridge with forward-to-gateway archiving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[build-dependencies]
# Stamps the commit into --version.
wslib-build-id.workspace = true

[dependencies]
# Also a build-dependency above; this side is the build_version! macro only.
wslib-build-id.workspace = true
wiretap-model = { path = "../wiretap-model" }
wslib-backoff.workspace = true
wslib-secret.workspace = true
# The GVRET, ingest and test-pattern codecs and the DLC table. No frame type crosses the
# boundary: the codecs take scalars and this crate adapts, which is what will
# let the desktop adopt them without touching the serde type its frontend reads.
wiretap-protocol.workspace = true
# `RtuTap`, which frames and stamps the serial tap's bytes. It brings the
# catalogue's other dependencies with it; what that costs the musl binary is
# recorded in the vault.
wiretap-catalog.workspace = true
# No `color` (stdout is a journal pipe) and no `suggestions` (a typo at an
# interactive shell is one --help away): together they cost 33 KB and 7 crates.
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
# The control socket's HTTP/1, and nothing above it: no router, no TLS.
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
# `bundled` compiles SQLite in, so the .deb depends on no libsqlite3 and the
# musl cross-build has nothing to find on the host.
rusqlite = { workspace = true, features = ["bundled"] }
# `assignments.json` and the control socket. wiretap-catalog links it already.
serde_json.workspace = true
# `ui.toml`. wiretap-model links both already.
serde.workspace = true
toml.workspace = true
# For naming the errno an open failed with, and the host's own name.
libc = "0.2"
tracing.workspace = true
# No `env-filter`: the level comes from the config file, and RUST_LOG would
# cost a regex engine in a binary that is shipped over the network.
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# `serial` alone, never `serial-write`: without it the only open compiled in is
# read-only, and no serialport or libudev is built.
wiretap-io = { workspace = true, features = ["can-socketcan", "serial"] }

[dev-dependencies]
wiretap-checksum.workspace = true
# The outage drill and the vcan loopback are integration tests, so they link
# against the crate rather than into it and need their own runtime. `net` and
# `io-util` are the vcan drill's: it drives the GVRET listener over a socket.
# `test-util` pauses the clock for the archive's reconnect schedule.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
socketcan = { workspace = true, features = ["tokio"] }

# The serial tap's pty tests run on a Mac too.
[target.'cfg(target_os = "macos")'.dev-dependencies]
wiretap-io = { workspace = true, features = ["serial"] }
