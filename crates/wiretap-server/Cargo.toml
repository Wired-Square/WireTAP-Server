[package]
name = "wiretap-server"
description = "WireTAP capture server: SocketCAN to GVRET bridge with forward-to-gateway archiving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[build-dependencies]
# Stamps the commit into --version.
wslib-build-id.workspace = true

[dependencies]
# Also a build-dependency above; this side is the build_version! macro only.
wslib-build-id.workspace = true
wiretap-model = { path = "../wiretap-model" }
wslib-backoff.workspace = true
wslib-secret = { workspace = true, features = ["serde"] }
wslib-file-atomic.workspace = true
# The ingest and test-pattern codecs and the raw serial tap.
wslib-wiretap-protocol.workspace = true
# The GVRET codec. No frame type crosses the boundary: the codecs take scalars
# and this crate adapts, which is what will let the desktop adopt them without
# touching the serde type its frontend reads.
wslib-can-gvret.workspace = true
# The CAN frame and the DLC table.
wslib-can.workspace = true
# A catalogue's Modbus RTU rules. What it costs the musl binary is recorded in
# the vault.
wslib-wiretap-catalogue.workspace = true
# `RtuTap`, which frames and stamps the serial tap's bytes.
wslib-modbus.workspace = true
wslib-serial.workspace = true
# No `color` (stdout is a journal pipe) and no `suggestions` (a typo at an
# interactive shell is one --help away): together they cost 33 KB and 7 crates.
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# The control socket's HTTP/1, and nothing above it: no router, no TLS.
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
# `bundled` compiles SQLite in, so the .deb depends on no libsqlite3 and the
# musl cross-build has nothing to find on the host.
rusqlite = { workspace = true, features = ["bundled"] }
# `assignments.json` and the control socket. wslib-wiretap-catalogue links it already.
serde_json.workspace = true
# `ui.toml`. wiretap-model links both already.
serde.workspace = true
toml.workspace = true
# For naming the errno an open failed with, and the host's own name.
libc = "0.2.183"
tracing.workspace = true
# `setup-core`, not `setup`: no `env-filter`, whose regex engine would ship in
# a binary that goes over the network. No `ansi`: stderr is a journal pipe.
wslib-telemetry = { workspace = true, features = ["setup-core"] }
wslib-service.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# `task` alone, never `write`: without it the only open compiled in is
# read-only, and no serialport or libudev is built.
wslib-serial = { workspace = true, features = ["task"] }
wslib-can = { workspace = true, features = ["task"] }
wslib-can-socketcan = { workspace = true, features = ["transport"] }

[dev-dependencies]
wslib-checksum.workspace = true
wslib-service = { workspace = true, features = ["testing"] }
# The outage drill and the vcan loopback are integration tests, so they link
# against the crate rather than into it and need their own runtime. `net` and
# `io-util` are the vcan drill's: it drives the GVRET listener over a socket.
# `test-util` pauses the clock for the archive's reconnect schedule.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
socketcan = { workspace = true, features = ["tokio"] }
# The vcan drill reads the log through a subscriber of its own.
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

# The serial tap's pty tests run on a Mac too.
[target.'cfg(target_os = "macos")'.dev-dependencies]
wslib-serial = { workspace = true, features = ["task"] }
