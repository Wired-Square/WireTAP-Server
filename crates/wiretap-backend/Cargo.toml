[package]
name = "wiretap-backend"
description = "WireTAP backend gateway: binary CAN ingest + HTTP query API over TimescaleDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[build-dependencies]
# Stamps the commit into /v1/health.
wslib-build-id.workspace = true

[dependencies]
# Also a build-dependency above; this side is the build_version! macro only.
wslib-build-id.workspace = true
# Only the sample types; default-features off keeps the TOML parser out.
wiretap-model = { path = "../wiretap-model", default-features = false }
wslib-secret.workspace = true
wslib-file-atomic.workspace = true
# The ingest codec, and the DLC table: a CAN row's `dlc` column and the `len`
# served from it.
wiretap-protocol.workspace = true
# What the daemon checks a catalogue with, so an assignment the gateway takes
# is one every daemon can frame with.
wiretap-catalog.workspace = true
wiretap-gateway.workspace = true
axum.workspace = true
# `wiretap-backend rotate` asks the running gateway, over its own listener.
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
base64.workspace = true
bytes.workspace = true
deadpool-postgres.workspace = true
flate2.workspace = true
futures-util.workspace = true
hex.workspace = true
postgres-protocol.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true

# Features are declared here rather than in the workspace table: an inherited
# feature list can only be added to, so anything set at the root becomes a floor
# for the appliance crates too.
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tower-http = { workspace = true, features = ["fs"] }
# Its `setup` brings `RUST_LOG` filtering, and so a regex engine the capture
# server does not want in a static musl binary.
wslib-telemetry = { workspace = true, features = ["setup", "ansi", "ring"] }

[dev-dependencies]
wslib-telemetry = { workspace = true, features = ["test-support"] }
