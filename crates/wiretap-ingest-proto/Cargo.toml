[package]
name = "wiretap-ingest-proto"
description = "Wire codec for the WireTAP binary ingest protocol, spoken by the capture server and the gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The id-flag layout, and nothing else from it: the framing and the CRC below
# are this protocol's own, and both ends of them are in this workspace. This
# crate depends on no frame type at all — the sample types live in
# wiretap-model, and nothing here needs one.
wiretap-protocol.workspace = true
crc32fast.workspace = true
